services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dang_ai_agent
      POSTGRES_USER: dang
      POSTGRES_PASSWORD: dang
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
